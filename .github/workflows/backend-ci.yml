name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Tests
      env:
        NODE_ENV: development
        ARCJET_ENV: development
        ACCESS_TOKEN_SECRET: ci-test-access-secret-key-min-32-chars-long
        REFRESH_TOKEN_SECRET: ci-test-refresh-secret-key-min-32-chars-long
        ACCESS_TOKEN_EXPIRY: 15m
        REFRESH_TOKEN_EXPIRY: 7d
      run: npm run test